name: iOS 15 TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-trollstore-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: src/ios/Minis.xcodeproj
  SCHEME: Minis
  CONFIGURATION: Release
  IOS_DEPLOYMENT_TARGET: '15.4'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostics"
          exec > >(tee "$RUNNER_TEMP/diagnostics/prerequisites.log") 2>&1
          brew install ninja llvm lld libarchive pkg-config meson
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build VAD from pinned C++ and Swift sources
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/diagnostics/vad-source-build.log") 2>&1
          VAD_CXX="$RUNNER_TEMP/vad-cxx"
          VAD_SWIFT="$RUNNER_TEMP/vad-swift"
          git clone https://github.com/helloooideeeeea/RealTimeCutVADCXXLibrary.git "$VAD_CXX"
          git -C "$VAD_CXX" checkout a56fc44c9b19a0faba73c70bec81815e6f304964
          git clone https://github.com/helloooideeeeea/RealTimeCutVADLibrary.git "$VAD_SWIFT"
          git -C "$VAD_SWIFT" checkout b059608836a055dc0ce74ca2d0eeb19fc54cb7d4
          mkdir -p "$VAD_CXX/Frameworks"
          curl --fail --retry 5 --retry-all-errors -L \
            https://github.com/helloooideeeeea/RealTimeCutVADLibraryForXCFramework/releases/download/v1.0.6/onnxruntime.xcframework.zip \
            -o "$RUNNER_TEMP/onnxruntime.zip"
          curl --fail --retry 5 --retry-all-errors -L \
            https://github.com/helloooideeeeea/RealTimeCutVADLibraryForXCFramework/releases/download/v1.0.6/webrtc_audio_processing.xcframework.zip \
            -o "$RUNNER_TEMP/webrtc_audio_processing.zip"
          unzip -q "$RUNNER_TEMP/onnxruntime.zip" -d "$VAD_CXX/Frameworks"
          unzip -q "$RUNNER_TEMP/webrtc_audio_processing.zip" -d "$VAD_CXX/Frameworks"
          BUILD="$RUNNER_TEMP/vad-build"
          rm -rf "$BUILD"
          build_vad() {
            local sdk="$1" out="$2" product="$3"
            xcodebuild -project "$VAD_CXX/RealTimeCutVADCXXLibrary.xcodeproj" \
              -scheme RealTimeCutVADCXXLibrary -configuration Release -sdk "$sdk" \
              -derivedDataPath "$out" BUILD_DIR="$out" \
              IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
              MACOSX_DEPLOYMENT_TARGET=11.0 BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              CODE_SIGNING_ALLOWED=NO clean build
            test -d "$out/$product/RealTimeCutVADCXXLibrary.framework"
          }
          build_vad iphoneos "$BUILD/device" Release-iphoneos
          build_vad iphonesimulator "$BUILD/simulator" Release-iphonesimulator
          xcodebuild -create-xcframework \
            -framework "$BUILD/device/Release-iphoneos/RealTimeCutVADCXXLibrary.framework" \
            -framework "$BUILD/simulator/Release-iphonesimulator/RealTimeCutVADCXXLibrary.framework" \
            -output "$BUILD/RealTimeCutVADCXXLibrary.xcframework"
          # Inspect every native slice, including the two prebuilt inputs. This
          # is a compatibility gate, not a Mach-O retagging step.
          find "$BUILD/RealTimeCutVADCXXLibrary.xcframework" "$VAD_CXX/Frameworks" \
            -type f -perm -111 -print0 | while IFS= read -r -d '' binary; do
            file "$binary" | grep -q 'Mach-O' || continue
            xcrun vtool -show-build "$binary" | tee -a "$RUNNER_TEMP/diagnostics/vad-macho-build-versions.log"
          done
          python3 - "$RUNNER_TEMP/diagnostics/vad-macho-build-versions.log" <<'PY'
          import re, sys
          bad = []
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              match = re.search(r'minos (\d+)\.(\d+)', line)
              if match and (int(match.group(1)), int(match.group(2))) > (15, 4):
                  bad.append(line.rstrip())
          if bad:
              raise SystemExit('VAD dependency minos exceeds iOS 15.4:\n' + '\n'.join(bad))
          PY
          mkdir -p build/RealTimeCutVADLibrary/Frameworks
          cp "$VAD_SWIFT/Package.swift" build/RealTimeCutVADLibrary/
          cp -R "$VAD_SWIFT/RealTimeCutVADLibrary" build/RealTimeCutVADLibrary/
          cp -R "$BUILD/RealTimeCutVADCXXLibrary.xcframework" build/RealTimeCutVADLibrary/Frameworks/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/RealTimeCutVADLibrary/Package.swift')
          s = p.read_text()
          start = s.index('        .binaryTarget(')
          end = s.index('        ),', start) + len('        ),')
          s = s[:start] + '''        .binaryTarget(\n            name: "RealTimeCutVADCXXLibrary",\n            path: "Frameworks/RealTimeCutVADCXXLibrary.xcframework"\n        )''' + s[end:]
          p.write_text(s)
          x = Path('src/ios/Minis.xcodeproj/project.pbxproj')
          s = x.read_text()
          import re
          pattern = r'(B318C2F47DB3F301A17E49BE /\* XCRemoteSwiftPackageReference "RealTimeCutVADLibrary" \*/ = \{).*?\n\t\t\};'
          replacement = r'\1\n\t\t\tisa = XCLocalSwiftPackageReference;\n\t\t\trelativePath = "../../build/RealTimeCutVADLibrary";\n\t\t};'
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert count == 1, 'VAD package reference not found'
          x.write_text(s)
          PY
          test -f build/RealTimeCutVADLibrary/Package.swift

      - name: Resolve packages and parse Swift before native builds
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/diagnostics/preflight.log") 2>&1
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/SourcePackages"
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          xcodebuild -showBuildSettings -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" CODE_SIGNING_ALLOWED=NO
          find src/ios -name '*.swift' ! -path 'src/ios/MinisTests/Standalone/*' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: Build native dependencies
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/diagnostics/native-dependencies.log") 2>&1
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          mkdir -p deps/libs deps/include deps/resources deps/frameworks
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Archive unsigned iOS 15 app
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/diagnostics/archive.log") 2>&1
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Minis.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -resultBundlePath "$RUNNER_TEMP/diagnostics/Archive.xcresult" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/diagnostics/package.log") 2>&1
          APP="$RUNNER_TEMP/Minis.xcarchive/Products/Applications/Minis.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "$IOS_DEPLOYMENT_TARGET"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # iOS 16-only extensions stay in modern builds, not this IPA.
          rm -rf "$RUNNER_TEMP/Payload/Minis.app/PlugIns/AgentWidgetExtension.appex"
          rm -rf "$RUNNER_TEMP/Payload/Minis.app/PlugIns/MinisFileProvider.appex"
          APP="$RUNNER_TEMP/Payload/Minis.app"
          # TrollStore re-signs at install and preserves embedded entitlements.
          # Ad-hoc signing carries capabilities, not a CoreTrust bypass.
          find "$APP" -depth -type d -name '*.framework' -print0 | while IFS= read -r -d '' bundle; do
            codesign --force --sign - "$bundle"
          done
          SHARE="$APP/PlugIns/MinisShare.appex"
          test -d "$SHARE"
          python3 scripts/trollstore_entitlements.py src/ios/Minis.entitlements \
            "$RUNNER_TEMP/diagnostics/app-signing.plist" \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          python3 scripts/trollstore_entitlements.py src/ios/ShareExtension/ShareExtension.entitlements \
            "$RUNNER_TEMP/diagnostics/share-signing.plist" \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SHARE/Info.plist")"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/diagnostics/share-signing.plist" "$SHARE"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/diagnostics/app-signing.plist" "$APP"
          codesign --verify --deep --strict "$APP"
          codesign --display --entitlements - --xml "$APP" > "$RUNNER_TEMP/diagnostics/app-entitlements.plist"
          codesign --display --entitlements - --xml "$SHARE" > "$RUNNER_TEMP/diagnostics/share-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/diagnostics/app-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/diagnostics/share-entitlements.plist"
          find "$APP" -type f -print0 | while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              printf '\n%s\n' "$binary"
              xcrun vtool -show-build "$binary"
            fi
          done > "$RUNNER_TEMP/diagnostics/macho-build-versions.log"
          ditto -c -k --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Minis-iOS15.ipa"
          unzip -t "$RUNNER_TEMP/Minis-iOS15.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS15-TrollStore-${{ github.sha }}
          path: ${{ runner.temp }}/Minis-iOS15.ipa
          retention-days: 3
          if-no-files-found: error

      - name: Upload build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS15-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diagnostics
            src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 3
          if-no-files-found: warn
